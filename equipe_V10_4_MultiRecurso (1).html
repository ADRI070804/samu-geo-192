<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SAMU 192 — Rastreamento do recurso</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#111}.wrap{max-width:580px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 5px 22px rgba(0,0,0,.10)}.badge{display:inline-block;background:#b71c1c;color:#fff;font-weight:800;padding:8px 12px;border-radius:10px;margin-bottom:12px}h1{font-size:25px;margin:0 0 8px}p{font-size:17px;line-height:1.45}.box{font-size:20px;font-weight:800;border-radius:12px;padding:10px 14px;text-align:center;margin:8px 0}.ficha{border:2px solid #b71c1c;color:#b71c1c}.recurso{background:#eceff1;border:2px solid #37474f;color:#263238;margin-bottom:16px}button{width:100%;min-height:62px;border:0;border-radius:14px;font-size:19px;font-weight:800;padding:12px;cursor:pointer}#start{background:#b71c1c;color:#fff}#stop{background:#e9ecef;color:#111;margin-top:12px;display:none}.status{margin-top:18px;padding:14px;border-radius:12px;background:#f5f5f5;font-size:16px;line-height:1.45}.ok{background:#e8f5e9}.warn{background:#fff8e1}.err{background:#ffebee}.air{background:#e3f2fd;border-radius:12px;padding:12px 14px;margin:12px 0;line-height:1.4}.small{font-size:13px;color:#555;margin-top:16px}</style></head>
<body><div class="wrap"><div class="card"><div class="badge">SAMU 192</div><h1>Rastreamento do recurso</h1><div id="ficha" class="box ficha"></div><div id="recurso" class="box recurso"></div><div id="air" class="air" style="display:none"></div><p id="instructions">Abra este link no início do deslocamento e mantenha esta página aberta. O GPS ficará vinculado somente a este recurso.</p><button id="start">INICIAR RASTREAMENTO</button><button id="stop">ENCERRAR RASTREAMENTO</button><div id="status" class="status">Aguardando início.</div><p class="small">Este link é individual. Outro recurso da mesma ficha deve usar o próprio link.</p></div></div>
<script>
const BACKEND="https://script.google.com/macros/s/AKfycbw7n1frCkcQ_1ACqrzLuMfqf1Cyj9--v1MiDh6e_lK_DbHdQsdgBe8yWLO0o9apM8nP3g/exec";
const q=new URLSearchParams(location.search), oc=q.get('oc')||'', id=q.get('id')||'', rid=q.get('rid')||'', token=q.get('t')||'', recurso=q.get('r')||'RECURSO', tipo=(q.get('type')||'').toUpperCase();
const start=document.getElementById('start'), stop=document.getElementById('stop'), status=document.getElementById('status'), air=document.getElementById('air');
document.getElementById('ficha').textContent=oc?'FICHA '+oc:'FICHA NÃO IDENTIFICADA'; document.getElementById('recurso').textContent=recurso;
if(tipo==='ASA ROTATIVA'){air.style.display='block';air.textContent='🚁 ASA ROTATIVA: este GPS acompanha a posição do recurso. Para localizar a ocorrência em voo, utilize as coordenadas geográficas fornecidas pela Central.';}
if(tipo==='ASA FIXA'){air.style.display='block';air.textContent='✈️ ASA FIXA: GPS do ponto não é necessário para esta missão.';start.style.display='none';status.textContent='GPS não necessário para ASA FIXA.';status.className='status ok';}
let watch=null,wake=null,last=0,active=false;
function show(t,c=''){status.className='status '+c;status.textContent=t}
async function lock(){try{if('wakeLock'in navigator&&document.visibilityState==='visible')wake=await navigator.wakeLock.request('screen')}catch(e){}}
async function send(pos){const now=Date.now();if(now-last<10000)return;last=now;const c=pos.coords,u=new URL(BACKEND);u.searchParams.set('mode','crew');u.searchParams.set('oc',oc);if(id)u.searchParams.set('id',id);if(rid)u.searchParams.set('rid',rid);u.searchParams.set('t',token);u.searchParams.set('lat',c.latitude);u.searchParams.set('lng',c.longitude);u.searchParams.set('acc',Number.isFinite(c.accuracy)?Math.round(c.accuracy):'');u.searchParams.set('_',now);try{await fetch(u.toString(),{mode:'no-cors',cache:'no-store'});show('Rastreamento ativo para '+recurso+' • precisão aproximada '+Math.round(c.accuracy||0)+' m • '+new Date().toLocaleTimeString('pt-BR'),'ok')}catch(e){show('Sem conexão. O GPS continuará tentando enviar novas posições.','warn')}}
function begin(){if(!oc||!token){show('Link inválido. Solicite novo link à Central.','err');return}if(!navigator.geolocation){show('Geolocalização indisponível neste aparelho.','err');return}active=true;lock();start.style.display='none';stop.style.display='block';show('Obtendo localização…','warn');watch=navigator.geolocation.watchPosition(send,e=>show(e.code===1?'Localização não autorizada. Permita o acesso ao GPS.':'Não foi possível obter a localização.','err'),{enableHighAccuracy:true,maximumAge:3000,timeout:20000})}
function end(){active=false;if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;if(wake){try{wake.release()}catch(e){}wake=null}start.style.display='block';stop.style.display='none';show('Rastreamento encerrado.','warn')}
start.addEventListener('click',begin);stop.addEventListener('click',end);document.addEventListener('visibilitychange',()=>{if(active&&document.visibilityState==='visible')lock()});
</script></body></html>
